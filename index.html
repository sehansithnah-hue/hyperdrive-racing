<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperDrive Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #000; color: #0f0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #menu h1 {
            color: #0ff;
            font-size: 3em;
            margin-bottom: 30px;
        }

        #menu p {
            color: #0f0;
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .carBtn {
            background: #003;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
        }

        .carBtn:active {
            background: #00f;
        }

        #gameScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #004;
        }

        #gameInfo {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border: 2px solid #0f0;
            font-family: monospace;
            z-index: 100;
        }

        #carDisplay {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10em;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>🏁 HyperDrive</h1>
        <p>Pick a Car</p>
        <div id="carList"></div>
    </div>

    <div id="gameScreen">
        <div id="carDisplay">🏎️</div>
        <div id="gameInfo">
            <div>Speed: <span id="speed">0</span> mph</div>
            <div>Press: W=Up, A=Left, D=Right</div>
        </div>
    </div>

    <script>
        const cars = [
            { name: "Ferrari 488", emoji: "🔴", id: 1 },
            { name: "Lamborghini", emoji: "🟡", id: 2 },
            { name: "Porsche 911", emoji: "⬛", id: 3 },
            { name: "McLaren P1", emoji: "🟢", id: 4 },
            { name: "Bugatti Chiron", emoji: "🔵", id: 5 },
            { name: "Tesla Plaid", emoji: "🟣", id: 6 },
            { name: "Nissan GT-R", emoji: "🟠", id: 7 },
            { name: "BMW M5", emoji: "⬜", id: 8 },
            { name: "Audi R8", emoji: "⚪", id: 9 },
            { name: "Corvette C8", emoji: "🔶", id: 10 }
        ];

        const carList = document.getElementById('carList');
        cars.forEach(car => {
            const btn = document.createElement('button');
            btn.className = 'carBtn';
            btn.innerHTML = `${car.emoji} ${car.name}`;
            btn.onclick = () => startGame(car);
            carList.appendChild(btn);
        });

        let speed = 0;
        let carPos = { x: 0, y: 0 };
        let selectedCar = null;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function startGame(car) {
            selectedCar = car;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            updateDisplay();
            gameLoop();
        }

        function updateDisplay() {
            document.getElementById('carDisplay').innerHTML = selectedCar.emoji;
            document.getElementById('speed').textContent = Math.floor(speed);
        }

        function gameLoop() {
            if (keys['w']) speed += 5;
            if (keys['s']) speed -= 5;
            if (keys['a']) carPos.x -= 10;
            if (keys['d']) carPos.x += 10;

            speed *= 0.95;
            speed = Math.max(0, Math.min(200, speed));

            const carDisplay = document.getElementById('carDisplay');
            carDisplay.style.left = carPos.x + 'px';
            updateDisplay();

            if (document.getElementById('gameScreen').style.display === 'block') {
                setTimeout(gameLoop, 50);
            }
        }
    </script>
</body>
</html>
